name: 公开仓库安全与测试

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: 运行单元测试
        run: python3 -m unittest discover -s skills/windows-os-intelligence/tests -v
      - name: 检查飞书敏感信息
        run: python3 scripts/check_public_repo.py
